name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install google-generativeai PyGithub

      - name: Run Gemini Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python -c "
          import os
          import google.generativeai as genai
          from github import Github

          genai.configure(api_key=os.environ['GEMINI_API_KEY'])
          model = genai.GenerativeModel('gemini-1.5-flash')

          g = Github(os.environ['GITHUB_TOKEN'])
          repo = g.get_repo(os.environ['REPO_NAME'])
          pr = repo.get_pull(int(os.environ['PR_NUMBER']))

          diffs = []
          for file in pr.get_files():
              if file.filename.endswith(('.py', '.js', '.ts', '.java', '.go', '.cpp')):
                  diffs.append(f'File: {file.filename}\nDiff:\n{file.patch}')

          diff_content = '\n'.join(diffs)

          if not diff_content:
              print('No code changes found.')
              exit(0)

          prompt = f'''
          Bạn là một chuyên gia Review Code Senior. Hãy review đoạn code diff dưới đây từ một Pull Request.

          Yêu cầu:
          1. Tìm các lỗi tiềm ẩn (bug), lỗ hổng bảo mật.
          2. Đề xuất cách tối ưu code (clean code, performance).
          3. Trả lời ngắn gọn, sử dụng Markdown. Nếu code tốt, hãy khen ngợi.

          Code Diff:
          {diff_content}
          '''

          try:
              response = model.generate_content(prompt)
              review_comment = response.text
              
              pr.create_issue_comment(f'## 🤖 Gemini Code Review\n\n{review_comment}')
              print('Review posted successfully.')
          except Exception as e:
              print(f'Error: {e}')
          "
