syntax = "proto3";

package subscription;

service SubscriptionService {
  rpc CreateSubscription (CreateSubscriptionRequest) returns (SubscriptionResponse);
  rpc GetSubscription (GetSubscriptionRequest) returns (SubscriptionResponse);
  rpc GetAllSubscription (GetSubscriptionListRequest) returns (SubscriptionListResponse);
  rpc ActivateSubscription (ActivateSubscriptionRequest) returns (SubscriptionResponse);
  rpc ExpireSubscription (ExpireSubscriptionRequest) returns (SubscriptionResponse);
}

enum SubscriptionStatus {
  Pending = 0;
  Active = 1;
  Cancelled = 2;
  Expired = 3;
}

message Subscription {
  string id = 1;
  string userId = 2;
  Package package = 3;
  optional string activatedAt = 4;
  optional string expiredAt = 5;
  int32 usageCounts = 6;
  SubscriptionStatus status = 7;
  string createdAt = 8;
  string updatedAt = 9;
}

message CreateSubscriptionRequest {
  string accountId = 1;
  string packageId = 2;
}

message GetSubscriptionRequest {
  string id = 1;
}

message ActivateSubscriptionRequest {
  string id = 1;
}

message ExpireSubscriptionRequest {
  string id = 1;
}

message GetSubscriptionListRequest {
  int32 page = 1;
  int32 limit = 2;
  optional string search = 3;
}

message SubscriptionResponse {
  bool success = 1;
  string message = 2;
  int32 statusCode = 3;
  Subscription data = 4;
  repeated string errors = 5;
}

message SubscriptionList {
  repeated Subscription items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
  int32 totalPages = 5;
}

message SubscriptionListResponse {
  bool success = 1;
  string message = 2;
  int32 statusCode = 3;
  SubscriptionList data = 4;
  repeated string errors = 5;
}

message User {
  string id = 1;
  string name = 2;
}

message Package {
  string id = 1;
  string name = 2;
  int32 price = 3;
  int32 maxUsages = 4;
  PackageStatus status = 5;
  string createdAt = 6;
  string updatedAt = 7;
}

enum PackageStatus {
  Active = 0;
  Inactive = 1;
}
