syntax = "proto3";

package rental;

service RentalService {
  rpc CreateRental (CreateRentalRequest) returns (CreateRentalResponse);
  rpc EndRental (EndRentalRequest) returns (EndRentalResponse);
}

enum RentalStatus {
  Rented = 0;
  Completed = 1;
  Cancelled = 2;
  Reserved = 3;
}

message Rental {
  string id = 1;
  string userId = 2;
  optional string bikeId = 3;
  string startStation = 4;
  optional string endStation = 5;
  string startTime = 6; // ISO 8601 string
  optional string endTime = 7; // ISO 8601 string
  int32 duration = 8;
  string totalPrice = 9; // Decimal string
  optional string subscriptionId = 10;
  RentalStatus status = 11;
  string createdAt = 12; // ISO 8601 string
  string updatedAt = 13; // ISO 8601 string
}

message CreateRentalRequest {
  string accountId = 1;
  string bikeId = 2;
  optional string subscriptionId = 3;
}

message CreateRentalResponse {
  bool success = 1;
  string message = 2;
  Rental data = 3;
  repeated string errors = 4;
  int32 statusCode = 5;
}

message EndRentalRequest {
  string accountId = 1;
  string id = 2;
}

message EndRentalResponse {
  bool success = 1;
  string message = 2;
  Rental data = 3;
  repeated string errors = 4;
  int32 statusCode = 5;
}
