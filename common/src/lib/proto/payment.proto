syntax = "proto3";

package payment;

import "google/protobuf/timestamp.proto";

service PaymentService {
  rpc CreatePaymentUrl (CreatePaymentUrlRequest) returns (CreatePaymentUrlResponse);
  rpc PaymentCallback (PaymentCallbackRequest) returns (Empty);
  rpc DebitRental (DebitRentalRequest) returns (DebitRentalResponse);
  rpc DebitSubscription (DebitSubscriptionRequest) returns (DebitSubscriptionResponse);
}

message DebitRentalRequest {
  string accountId = 1;
  int32 amount = 2;
  string rentalId = 3;
}

message DebitRentalResponse {
  bool success = 1;
  string message = 2;
  Empty data = 3;
  repeated string errors = 4;
  int32 statusCode = 5;
  google.protobuf.Timestamp createdAt = 6; 
  google.protobuf.Timestamp updatedAt = 7;
}

message DebitSubscriptionRequest {
  string accountId = 1;
  int32 amount = 2;
  string subscriptionId = 3;
}

message DebitSubscriptionResponse {
  bool success = 1;
  string message = 2;
  Empty data = 3;
  repeated string errors = 4;
  int32 statusCode = 5;
  google.protobuf.Timestamp createdAt = 6; 
  google.protobuf.Timestamp updatedAt = 7;
}

message CreatePaymentUrlRequest {
  int32 amount = 1;
  string ipAddr =2;
  string accountId = 3;
}

message PaymentCallbackRequest {
  string accountId = 1;
  int32 amount = 2;
  string description = 3;
}

message CreatePaymentUrlResponse {
  bool success = 1;
  string message = 2;
  PaymentUrl data = 3;
  repeated string errors = 4;
  int32 statusCode = 5;
}

message PaymentUrl {
  string paymentUrl = 1;
}

message Empty {}